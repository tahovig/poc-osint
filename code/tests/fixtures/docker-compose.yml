version: "3.7"

services:
  healthy-host:
    build: .
    environment:
      SECURE_HEADERS: "1"
      SERVER_BANNER: "FixtureServer/1.0"
    ports:
      - "8081:80"

  vulnerable-host:
    build: .
    environment:
      SECURE_HEADERS: "0"
      SERVER_BANNER: "Apache/2.2.22 (Debian)"
      EXTRA_HEADERS: "X-Powered-By:PHP/5.4.4"
    ports:
      - "8082:80"
