[project]
name = "poc-osint"
version = "0.1.0"
description = "Automated corporate footprint & subdomain recon tool"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
poc-osint = "poc_osint.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires the Docker fixtures in tests/fixtures/ to be running",
]
addopts = "-m 'not integration'"
